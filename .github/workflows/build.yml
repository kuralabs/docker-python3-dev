name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly rebuild to pick up base image security updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_REPO: ghcr.io/kuralabs/python3-dev
  DOCKERHUB_REPO: docker.io/kuralabs/python3-dev
  TAGS: 26.04 latest
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: python3-dev:test

      - name: Smoke test
        run: |
          docker run --rm --init \
            --volume "${PWD}/test:/test:ro" \
            python3-dev:test /test/smoke-test

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          outputs: type=image,"name=${{ env.GHCR_REPO }},${{ env.DOCKERHUB_REPO }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for repo in "${GHCR_REPO}" "${DOCKERHUB_REPO}"; do
            tags=()
            for tag in ${TAGS}; do
              tags+=(--tag "${repo}:${tag}")
            done
            sources=()
            for digest in *; do
              sources+=("${repo}@sha256:${digest}")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "${repo}:latest"
          done
